[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.17.0"
material3 = "1.4.0"
# 1.4.1 → 1.5.0：为了对齐 Jellyfin 的 FFmpeg 音频软解扩展（它只有 1.5.0+1 这档）
media3 = "1.5.0"
libmpv = "0.4.1"
coil = "3.0.4"
coroutines = "1.9.0"
serialization = "1.7.3"
gson = "2.11.0"
# 汉字转拼音（方案 B：内置键盘打拼音首字母搜中文，Apache-2.0）
tinypinyin = "2.0.3"
lifecycle = "2.8.7"
savedstate = "1.2.1"
tvMaterial = "1.0.1"
tvFoundation = "1.0.0-alpha11"
navigation = "2.9.6"
zxing = "3.5.2"
nanohttpd = "2.3.1"
# Khronos 官方 Android OpenXR loader（prefab 包，含头文件与 .so）
openxrLoader = "1.1.49"

[libraries]
libmpv = { group = "dev.jdtech.mpv", name = "libmpv", version.ref = "libmpv" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }

# 面板层（把 Compose 界面挂到虚拟显示器的 Presentation 窗口）需要手动设
# ViewTree 三个 owner：Lifecycle / ViewModelStore / SavedStateRegistry。
# 这三个 API 所在的 artifact 不在 activity-compose 的编译可见传递依赖里
# （2026-10-04 CI 报 Unresolved reference，改为显式声明）。
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-savedstate-ktx = { group = "androidx.savedstate", name = "savedstate-ktx", version.ref = "savedstate" }

# 面板层要承载电视版 B0BEmby 的真实界面，这些是那套界面用到的库
# （版本与电视版对齐，避免同一份界面代码两边行为不一致）。
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
nanohttpd = { group = "org.nanohttpd", name = "nanohttpd", version.ref = "nanohttpd" }
openxr-loader = { group = "org.khronos.openxr", name = "openxr_loader_for_android", version.ref = "openxrLoader" }

# 播放：Media3 ExoPlayer（输出到 OpenXR 的 Android Surface）
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
# FFmpeg 音频软解扩展不走远程仓库：用 app/libs/media3-ffmpeg-decoder-1.5.0.aar
# （父亲 2026-10-07 定：本地一份，不要每次编译都去拉）

# 图片：海报加载
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# 协程 / 序列化
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# JSON：Emby 数据层（HttpClient / EmbyApi / DTO）沿用 TV 版的 Gson 实现，
# DTO 上全是 @SerializedName 注解，换 kotlinx.serialization 要重写全部模型，
# 直接与 TV 版保持一致更省事、也便于两边同步修 bug。
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# 汉字 → 拼音（内置键盘的拼音首字母匹配用）
tinypinyin = { group = "com.github.promeg", name = "tinypinyin", version.ref = "tinypinyin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
