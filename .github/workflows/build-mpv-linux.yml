name: build-mpv-linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential meson ninja-build pkg-config git \
            libass-dev libdrm-dev libx11-dev libxext-dev libxrandr-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgbm-dev libvulkan-dev libshaderc-dev \
            glslang-tools libarchive-dev libluajit-5.1-dev libjpeg-dev libzimg-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev

      - name: 编 libplacebo（带杜比还原）
        run: |
          git clone --depth 1 --branch v7.349.0 https://github.com/haasn/libplacebo.git /tmp/lp
          cd /tmp/lp && git submodule update --init --recursive --depth 1
          meson setup build --prefix=/usr/local -Ddemos=false -Dvulkan=enabled -Dshaderc=enabled -Dglslang=disabled
          ninja -C build -j"$(nproc)"
          sudo ninja -C build install
          sudo ldconfig

      - name: 编 mpv
        run: |
          git clone --depth 1 --branch v0.39.0 https://github.com/mpv-player/mpv.git /tmp/mpv
          cd /tmp/mpv
          meson setup build --prefix=/usr/local -Dlibplacebo=enabled -Dvulkan=enabled \
            -Dcplayer=true -Dlibmpv=true -Dbuild-date=false -Dtests=false
          ninja -C build -j"$(nproc)"
          ./build/mpv --version

      - name: 打包
        run: |
          mkdir -p out
          cp /tmp/mpv/build/mpv out/
          ldd /tmp/mpv/build/mpv | grep -E "libplacebo|libav|libsw" || true
          tar czf mpv-linux-x86_64.tar.gz -C out .
          ls -lh mpv-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-linux-x86_64
          path: mpv-linux-x86_64.tar.gz
          retention-days: 7
