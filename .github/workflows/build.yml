name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 写入 Emby 连接参数。
      #
      # 为什么不写在源码里：仓库公开，API Key 进源码等于泄露。
      # 这里用 GitHub Secrets（Settings → Secrets and variables → Actions）：
      #   EMBY_API_KEY   必填，Emby 后台生成的 API Key
      #   EMBY_SERVER    选填，默认内网 http://192.168.150.15:6908
      #   EMBY_USER_ID   选填，默认父亲账号 wangbob 的 guid
      # Secret 未配置时该步骤不写文件，构建仍能通过，只是应用内提示未配置。
      - name: 写入 Emby 配置
        env:
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
          EMBY_SERVER: ${{ secrets.EMBY_SERVER }}
          EMBY_USER_ID: ${{ secrets.EMBY_USER_ID }}
        run: |
          if [ -z "$EMBY_API_KEY" ]; then
            echo "::warning::未配置 EMBY_API_KEY，本次产物不含 Emby 连接信息"
            exit 0
          fi
          {
            echo "EMBY_SERVER=${EMBY_SERVER:-http://192.168.150.15:6908}"
            echo "EMBY_API_KEY=$EMBY_API_KEY"
            echo "EMBY_USER_ID=${EMBY_USER_ID:-40a02f8503ce4de49d58331a282dcea1}"
          } > local.properties
          echo "local.properties 已写入（Key 长度 ${#EMBY_API_KEY}）"

      # 装机一律用 release：TV 版实测 debug 包每帧 650ms、release 32ms（debug 不跑 AOT）
      - name: 编译 APK（debug + release）
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --build-cache

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out/

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vbuild-${{ github.run_number }}
          name: B0BEmby VR build ${{ github.run_number }}
          body: VR 版自动编译产物（debug + release）
          files: out/*.apk
          draft: false
