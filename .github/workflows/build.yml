name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 写入 Emby 连接参数。
      #
      # 为什么不写在源码里：仓库公开，API Key 进源码等于泄露。
      # 这里用 GitHub Secrets（Settings → Secrets and variables → Actions）：
      #   EMBY_API_KEY   必填，Emby 后台生成的 API Key
      #   EMBY_SERVER    选填，默认内网 http://192.168.150.15:6908
      #   EMBY_USER_ID   选填，默认父亲账号 wangbob 的 guid
      # Secret 未配置时该步骤不写文件，构建仍能通过，只是应用内提示未配置。
      # 【2026-10-20 大文件不进仓库】
      # Chromium 132 内核库 212MB，超过 GitHub 单文件 100MB 上限，推不上去（实测被拒）。
      # 改成编译机上现下：从 crwebview 官方 release 拉那两个 aar 到 app/libs。
      # 只影响 CI；本地开发时项目里已经有这两个文件。
      - name: 下载 Chromium 132 内核库
        run: |
          mkdir -p app/libs
          # 2026-11-08：crwebview 那几个大资产的浏览器下载链路持续 504（直连与三个镜像全挂，
          # 重试 8 次仍 504），但同一资产走 API 通道（/releases/assets/<id> + octet-stream）
          # 返回 206，可正常下 —— 所以这里改走 API，不再拼下载链接。公开仓库免令牌即可。
          API=https://api.github.com/repos/wuruxu/crwebview
          # 2026-11-13：不带令牌调这个接口会被限流（今晚连编十几次后返回体里没有 assets，
          # 脚本 KeyError 直接判失败）。改用编译机自带的 GITHUB_TOKEN，并把返回体容错打印出来。
          LIST=$(curl -sS --retry 5 --retry-all-errors \
                 -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                 -H "Accept: application/vnd.github+json" \
                 "$API/releases/tags/2.0.0" \
                 | python3 -c 'import json,sys;d=json.load(sys.stdin);print("\n".join("%s\t%s"%(a["name"],a["id"]) for a in d.get("assets",[])))')
          if [ -z "$LIST" ]; then echo "::error::拿不到 crwebview 资产清单"; exit 1; fi
          for f in android_crwebview_webkit.WebView-v2.0.0.aar android_webview_resources-debug.aar content-debug.aar ui-debug.aar embedder_support_resources-debug.aar; do
            [ -f "app/libs/$f" ] && continue
            id=$(printf '%s\n' "$LIST" | awk -F'\t' -v n="$f" '$1==n{print $2}')
            if [ -z "$id" ]; then echo "::error::清单里没有 $f"; exit 1; fi
            echo "下载 $f（asset $id）"
            curl -fL --retry 8 --retry-delay 10 --retry-all-errors \
                 -H "Accept: application/octet-stream" \
                 -o "app/libs/$f" "$API/releases/assets/$id"
            unzip -tq "app/libs/$f" >/dev/null 2>&1 || { echo "::error::$f 下载不完整"; exit 1; }
          done
          ls -lh app/libs/

      # 杜比内核（libmpv + 我们自己的 dovi 补丁）也从 Release 拉。
      #
      # 原来把 44MB 的 aar 提交在仓库里，每改一次内核就要本地上传一次，
      # 推送要等好几分钟，期间 GitHub 上还看不到编译任务。
      # 现在客户端编译时现下：内核工作流编完发到 kernel-dovi Release，
      # 这边引用同一份产物，改内核不必再动客户端仓库。
      - name: 下载杜比内核
        run: |
          mkdir -p app/libs
          curl -fL --retry 5 --retry-all-errors -o app/libs/libmpv-dovi.aar \
            "https://github.com/wangbob-0787/B0BEmby-VR/releases/download/kernel-dovi/libmpv-release.aar"
          unzip -tq app/libs/libmpv-dovi.aar

      - name: 写入 Emby 配置
        env:
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
          EMBY_SERVER: ${{ secrets.EMBY_SERVER }}
          EMBY_USER_ID: ${{ secrets.EMBY_USER_ID }}
        run: |
          if [ -z "$EMBY_API_KEY" ]; then
            echo "::warning::未配置 EMBY_API_KEY，本次产物不含 Emby 连接信息"
            exit 0
          fi
          {
            echo "EMBY_SERVER=${EMBY_SERVER:-http://192.168.150.15:6908}"
            echo "EMBY_API_KEY=$EMBY_API_KEY"
            echo "EMBY_USER_ID=${EMBY_USER_ID:-40a02f8503ce4de49d58331a282dcea1}"
          } > local.properties
          echo "local.properties 已写入（Key 长度 ${#EMBY_API_KEY}）"

      # 装机一律用 release：TV 版实测 debug 包每帧 650ms、release 32ms（debug 不跑 AOT）
      #
      # BUILD_NUMBER 必须传（2026-10-12 补）：app/build.gradle.kts:90 用它算
      # versionCode/versionName，缺省值 1。这条 env 一直漏着，导致从 build-1 到
      # build-461 每个包的 versionCode 都是 1、versionName 都是 0.1.1 ——
      # 桌面按版本号判断"是不是新包"，版本号不变就一直用缓存里的旧图标，
      # 父亲看到的"图标没换成最新的"根源就在这里（覆盖安装多少次都没用）。
      - name: 编译 APK（debug + release）
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --build-cache

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out/

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vbuild-${{ github.run_number }}
          name: B0BEmby VR build ${{ github.run_number }}
          body: VR 版自动编译产物（debug + release）
          files: out/*.apk
          draft: false
