name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 写入 Emby 连接参数。
      #
      # 为什么不写在源码里：仓库公开，API Key 进源码等于泄露。
      # 这里用 GitHub Secrets（Settings → Secrets and variables → Actions）：
      #   EMBY_API_KEY   必填，Emby 后台生成的 API Key
      #   EMBY_SERVER    选填，默认内网 http://192.168.150.15:6908
      #   EMBY_USER_ID   选填，默认父亲账号 wangbob 的 guid
      # Secret 未配置时该步骤不写文件，构建仍能通过，只是应用内提示未配置。
      # 【2026-10-20 大文件不进仓库】
      # Chromium 132 内核库 212MB，超过 GitHub 单文件 100MB 上限，推不上去（实测被拒）。
      # 改成编译机上现下：从 crwebview 官方 release 拉那两个 aar 到 app/libs。
      # 只影响 CI；本地开发时项目里已经有这两个文件。
      # ncnn 预编译静态库 + Depth Anything V2 Small 权重（69MB，不进仓库）。
      # 只解 arm64-v8a：PICO 4 是 XR2，其他 ABI 用不上。
      - name: 下载 ncnn 与深度模型
        run: |
          set -e
          NCNN_DIR=app/src/main/cpp/ncnn
          if [ ! -f "$NCNN_DIR/lib/libncnn.a" ]; then
            curl -fL --retry 3 --retry-delay 5 -o /tmp/ncnn.zip \
              https://github.com/Tencent/ncnn/releases/download/20261020/ncnn-20261020-android-vulkan.zip
            rm -rf /tmp/ncnn && mkdir -p /tmp/ncnn && unzip -q /tmp/ncnn.zip -d /tmp/ncnn
            mkdir -p "$NCNN_DIR/lib" "$NCNN_DIR/include"
            cp /tmp/ncnn/ncnn-20261020-android-vulkan/arm64-v8a/lib/*.a "$NCNN_DIR/lib/"
            cp -r /tmp/ncnn/ncnn-20261020-android-vulkan/arm64-v8a/include/* "$NCNN_DIR/include/"
          fi
          ls -lh "$NCNN_DIR/lib" | head
          MODELS=app/src/main/assets/models
          BASE=https://raw.githubusercontent.com/FeiGeChuanShu/ncnn-android-depth_anything/main/app/src/main/assets
          for f in dptv2_s.param dptv2_s.bin; do
            if [ ! -f "$MODELS/$f" ]; then
              curl -fL --retry 3 --retry-delay 5 -o "$MODELS/$f" "$BASE/$f"
            fi
          done
          ls -lh "$MODELS" | head

      # ncnn 用 -fopenmp 编译，运行时要 libomp.so（NDK 只带共享版，不带进包就会
      # dlopen 失败、整个原生库加载不了）。这里从 NDK 里拷一份进 jniLibs。
      - name: 打包 libomp.so
        run: |
          set -e
          SRC=$(ls -d $ANDROID_HOME/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/lib/clang/*/lib/linux/aarch64 2>/dev/null | head -1)
          echo "NDK libomp: $SRC"
          ls -l "$SRC"/libomp.so
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SRC"/libomp.so app/src/main/jniLibs/arm64-v8a/

      - name: 下载 Chromium 132 内核库
        run: |
          mkdir -p app/libs
          BASE=https://github.com/wuruxu/crwebview/releases/download/2.0.0
          for f in android_crwebview_webkit.WebView-v2.0.0.aar android_webview_resources-debug.aar content-debug.aar ui-debug.aar embedder_support_resources-debug.aar; do
            if [ ! -f "app/libs/$f" ]; then
              echo "下载 $f"
              curl -fL --retry 3 --retry-delay 5 -o "app/libs/$f" "$BASE/$f"
            fi
          done
          ls -lh app/libs/

      - name: 写入 Emby 配置
        env:
          EMBY_API_KEY: ${{ secrets.EMBY_API_KEY }}
          EMBY_SERVER: ${{ secrets.EMBY_SERVER }}
          EMBY_USER_ID: ${{ secrets.EMBY_USER_ID }}
        run: |
          if [ -z "$EMBY_API_KEY" ]; then
            echo "::warning::未配置 EMBY_API_KEY，本次产物不含 Emby 连接信息"
            exit 0
          fi
          {
            echo "EMBY_SERVER=${EMBY_SERVER:-http://192.168.150.15:6908}"
            echo "EMBY_API_KEY=$EMBY_API_KEY"
            echo "EMBY_USER_ID=${EMBY_USER_ID:-40a02f8503ce4de49d58331a282dcea1}"
          } > local.properties
          echo "local.properties 已写入（Key 长度 ${#EMBY_API_KEY}）"

      # 装机一律用 release：TV 版实测 debug 包每帧 650ms、release 32ms（debug 不跑 AOT）
      #
      # BUILD_NUMBER 必须传（2026-10-12 补）：app/build.gradle.kts:90 用它算
      # versionCode/versionName，缺省值 1。这条 env 一直漏着，导致从 build-1 到
      # build-461 每个包的 versionCode 都是 1、versionName 都是 0.1.1 ——
      # 桌面按版本号判断"是不是新包"，版本号不变就一直用缓存里的旧图标，
      # 父亲看到的"图标没换成最新的"根源就在这里（覆盖安装多少次都没用）。
      - name: 编译 APK（debug + release）
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace --build-cache

      - name: 收集 APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/ 2>/dev/null || true
          ls -la out/

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vbuild-${{ github.run_number }}
          name: B0BEmby VR build ${{ github.run_number }}
          body: VR 版自动编译产物（debug + release）
          files: out/*.apk
          draft: false
